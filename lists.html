<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List</title>
</head>
<body>
<h1>List</h1>
<h2>Ordered List</h2>
<h1>List of Countries</h1>
<ol>
    <li>Kenya</li>
    <li>Uganda</li>
    <li>Tanzania</li>
    <li>Rwanda</li>
</ol>

<h2>Unordered list</h1>
<h1>List of fruits</h2>

<ul>
    <li>Orange</li>
    <li>Banana</li>
    <li>Watermelon</li>
</ul>

<h2>Descriptive List</h2>
<dl>
    <dt>Apple</dt>
    <dd>A round fruit with red skin.</dd>
    <dt>Banana</dt>
    <dd> A crescent fruit with a yellow peel.</dd>
</dl>
</body>
</html>
